# =====================================================================
# SmartDesk - configuration du backend
# Aucune valeur secrète ici : tout vient des variables d'environnement
# ou du fichier .env à la racine du projet (voir .env.example).
# =====================================================================

server:
  # 8095 et non 8080 : le port 8080 est souvent pris (Oracle XE, Tomcat, Jenkins...)
  port: ${SERVER_PORT:8095}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: smartdesk-backend
  config:
    # Lit le .env de la racine (lancement depuis backend/) ou du dossier courant
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbot_db}
    username: ${DB_USERNAME:smartdesk}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Au moins 32 caractères aléatoires (le script setup.ps1 en génère une)
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:61748}
  nlp:
    url: ${NLP_URL:http://localhost:8000}
    # Clé partagée backend <-> service NLP (en-tête X-API-Key)
    api-key: ${NLP_API_KEY:}
  documents:
    dir: ${DOCUMENTS_DIR:./documents}
  admin:
    # Compte admin créé au premier démarrage. Modifier ADMIN_PASSWORD puis redémarrer
    # le backend change le mot de passe du compte (sinon il n'est jamais touché).
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@fpst.tn}
    password: ${ADMIN_PASSWORD:}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  # Fuseau horaire de l'établissement (pointage des présences)
  timezone: ${APP_TIMEZONE:Africa/Tunis}
  registre:
    # local   = registre importé (Excel/CSV) ou données de démonstration
    # externe = base de données de la faculté, en lecture seule (voir README)
    mode: ${REGISTRE_MODE:local}
    externe:
      url: ${REGISTRE_DB_URL:}
      username: ${REGISTRE_DB_USERNAME:}
      password: ${REGISTRE_DB_PASSWORD:}
      requete: ${REGISTRE_DB_REQUETE:}
  rfid:
    # Clé partagée avec le programme de pointage (en-tête X-Device-Key)
    device-key: ${RFID_DEVICE_KEY:}
    # Deux passages du même badge à moins de N secondes = un seul passage
    anti-rebond-secondes: ${RFID_ANTI_REBOND_SECONDES:60}
